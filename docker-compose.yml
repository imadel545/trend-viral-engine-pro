version: '3.8'

services:
  # ========================================
  # API Service
  # ========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trend-engine-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - QDRANT_HOST=qdrant
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./models:/app/models
      - ./outputs:/app/outputs
    depends_on:
      - qdrant
      - mlflow
    networks:
      - trend-engine-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Qdrant Vector Store
  # ========================================
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: trend-engine-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - trend-engine-network
    restart: unless-stopped

  # ========================================
  # MLflow Tracking Server
  # ========================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: trend-engine-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./models:/mlflow/models
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlruns/mlflow.db
      --default-artifact-root /mlflow/mlruns
    networks:
      - trend-engine-network
    restart: unless-stopped

  # ========================================
  # Prometheus Monitoring
  # ========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: trend-engine-prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/rules:/etc/prometheus/rules
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - trend-engine-network
    restart: unless-stopped

  # ========================================
  # Grafana Dashboards
  # ========================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: trend-engine-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - trend-engine-network
    restart: unless-stopped

  # ========================================
  # Prefect Server (Orchestration)
  # ========================================
  prefect:
    image: prefecthq/prefect:2.14-python3.10
    container_name: trend-engine-prefect
    ports:
      - "4200:4200"
    environment:
      - PREFECT_API_URL=http://0.0.0.0:4200/api
      - PREFECT_SERVER_API_HOST=0.0.0.0
    volumes:
      - prefect_data:/root/.prefect
    command: prefect server start --host 0.0.0.0
    networks:
      - trend-engine-network
    restart: unless-stopped

  # ========================================
  # Worker Service (Flows execution)
  # ========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trend-engine-worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PREFECT_API_URL=http://prefect:4200/api
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./models:/app/models
      - ./outputs:/app/outputs
    depends_on:
      - prefect
      - qdrant
      - mlflow
    networks:
      - trend-engine-network
    command: python -m scripts.worker
    restart: unless-stopped

networks:
  trend-engine-network:
    driver: bridge

volumes:
  qdrant_storage:
  prometheus_data:
  grafana_data:
  prefect_data:
