[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ═══════════════════════════════════════════════════════════════════
# PROJECT METADATA
# ═══════════════════════════════════════════════════════════════════
[project]
name = "trend-viral-engine"
version = "0.2.0"  # Bumped post-E2E fixes
description = "ML-powered viral trend detection and video generation engine"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trend Engine Team", email = "contact@trendengine.ai"}
]
maintainers = [
    {name = "Trend Engine Team", email = "contact@trendengine.ai"}
]
requires-python = ">=3.10,<3.13"
keywords = [
    "machine-learning",
    "deep-learning",
    "viral-detection",
    "content-generation",
    "trend-analysis",
    "fastapi",
    "pytorch",
    "transformers"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "Framework :: FastAPI",
]

# ───────────────────────────────────────────────────────────────────
# DEPENDENCIES
# ───────────────────────────────────────────────────────────────────
# NOTE: Fichiers requirements-*.txt utilisés pour installation réelle
# Les dépendances ci-dessous servent de référence pour pip install -e .
dependencies = [
    # Config
    "python-dotenv>=1.0.0",
    
    # API
    "fastapi>=0.104.1,<0.105.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
    "httpx>=0.26.0",
    
    # ML Core
    "torch>=2.4.0,<2.5.0",
    "transformers>=4.57.0,<4.58.0",
    "sentence-transformers>=5.1.0,<6.0.0",
    "lightgbm>=4.6.0,<5.0.0",
    "scikit-learn>=1.4.0,<1.5.0",
    
    # Data
    "pandas>=2.1.0,<2.2.0",
    "pyarrow>=14.0.0,<15.0.0",
    "numpy>=1.26.0,<1.27.0",
    
    # Logging
    "loguru>=0.7.2",
    "prometheus-client>=0.19.0",
]

# ───────────────────────────────────────────────────────────────────
# OPTIONAL DEPENDENCIES (extras_require)
# ───────────────────────────────────────────────────────────────────
[project.optional-dependencies]
# Dev tools (testing, linting, formatting)
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
    "ruff>=0.1.11",
    "pre-commit>=3.6.0",
]

# ML avancé (time series, multimodal, etc.)
ml-advanced = [
    "tsfresh>=0.20.2",
    "open-clip-torch>=2.23.0",
    "qdrant-client>=1.7.0",
    "optuna>=3.5.0",
    "shap>=0.44.0",
]

# Video generation complète
video = [
    "moviepy>=1.0.3",
    "pillow>=10.1.0",
]

# Orchestration & MLOps
mlops = [
    "prefect>=2.14.11",
    "mlflow>=2.9.2",
]

# TOUT installer (développement complet)
all = [
    "trend-viral-engine[dev,ml-advanced,video,mlops]"
]

# ═══════════════════════════════════════════════════════════════════
# SETUPTOOLS CONFIG
# ═══════════════════════════════════════════════════════════════════
[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.setuptools.package-data]
"src" = ["py.typed"]

# ───────────────────────────────────────────────────────────────────
# ENTRY POINTS (CLI commands)
# ───────────────────────────────────────────────────────────────────
[project.scripts]
trend-engine = "src.api.main:cli"
trend-train = "scripts.training.train_baseline:main"
trend-collect = "scripts.fix_ingestion:main"

# ═══════════════════════════════════════════════════════════════════
# TOOL CONFIGS
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# Black (Formatter)
# ───────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Default excludes
  \.eggs
  | \.git
  | \.mypy_cache
  | \.venv
  | venv
  | build
  | dist
  | outputs
  | data
  | logs
  | models
)/
'''

# ───────────────────────────────────────────────────────────────────
# isort (Import Sorter)
# ───────────────────────────────────────────────────────────────────
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["**/migrations/*", "venv/*", "data/*", "outputs/*"]

# ───────────────────────────────────────────────────────────────────
# Pytest (Testing)
# ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=70
"""
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (slower, may use network)",
    "e2e: End-to-end tests (full pipeline)",
    "slow: Tests that take >5 seconds",
    "gpu: Tests requiring GPU",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ───────────────────────────────────────────────────────────────────
# Coverage
# ───────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
show_missing = true

# ───────────────────────────────────────────────────────────────────
# Mypy (Type Checking)
# ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Progressif
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "moviepy.*",
    "praw.*",
    "asyncpraw.*",
    "pytrends.*",
    "lightgbm.*",
]
ignore_missing_imports = true

# ───────────────────────────────────────────────────────────────────
# Ruff (Ultra-fast Linter)
# ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "data",
    "logs",
    "outputs",
    "models",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
    "B905",  # zip() without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__
"tests/**/*.py" = ["S101"]  # Assert OK in tests
